<!doctype html>
<!-- The charset is the first thing after the doctype, ahead of every comment, so it
     stays inside the first 1024 bytes no matter how much prose lands below it. It had
     been guessing before: every em dash came out as "â€"" and the HUD read
     "Keys 1â€"6 pick a module". Prose grows; that budget does not. -->
<meta charset="utf-8">
<!-- `lang` is on a real root element below, because there was not one: the file
     relied on the parser inventing it, which works for layout and loses the language.
     A screen reader needs it to choose a Portuguese voice, and the page is Portuguese.

     Do not write the root element's own tag inside a comment here. Vite injects the
     module script immediately after the first literal occurrence of that tag in the
     file, and if the first one is in a comment the script is injected *into* the
     comment — the built page then loads nothing at all, silently, with no console
     error. The dev server never shows it, because nothing is injected there. It
     shipped once: the first GitHub Pages deploy served a blank page. -->
<html lang="pt-BR">
<!-- **This was missing entirely**, which is most of "a parte do navegador ta deixando
     tudo mt pequeno" on a phone: without it a mobile browser lays the page out at a
     980px virtual width and scales the result down, so the Unit arrives at roughly a
     third of the size it should. It also broke the rotated frame's arithmetic, which
     reads `innerWidth` and was being told 980 rather than the device's width.
     `viewport-fit=cover` is what makes `safe-area-inset-*` resolve to anything other
     than zero on a notched screen. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!--
  Tag Manager.

  The container is loaded **only on the published host**, so a day of pressing every
  Pad four hundred times on localhost does not become the dataset. `GTM` below is the
  one place the container id lives; empty means no container is loaded at all, which
  is also how the site runs with tracking switched off.

  `dataLayer` is declared before the loader so the events `track.js` pushes during
  boot are already in the queue when the container arrives. The object is one page
  that never navigates — the pageview says almost nothing, and the events are the
  analytics.

  No `<noscript>` iframe, which the standard snippet includes. It exists to record
  visitors whose browser runs no JavaScript — and this object *is* JavaScript: without
  it there is no scene, no Screen and nothing to measure. The only thing that tag
  could ever count here is a crawler.

  No consent gate yet. Everything GTM ends up setting is a decision made in the
  container rather than here; if a GA4 tag goes in, LGPD makes a banner the honest
  next step. See HANDOFF.md.
-->
<script>
  window.dataLayer = window.dataLayer || [];
  (function () {
    var GTM = 'GTM-PLPVLQH9';
    if (!GTM || !/(^|\.)nanj\.in$/.test(location.hostname)) return;
    window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM;
    document.head.appendChild(s);
  })();
</script>

  /**
   * Portrait on a phone: **turn the page, not the phone.**
   *
   * The Unit is 1.82 wide and the display inside it is 16:9, so a portrait viewport
   * shrinks the object to a size nothing on it can be read at. The first pass put up
   * a wall and asked the visitor to rotate. Fernando: *"não precisa girar a tela.
   * Mantenha ela na horizontal (com o aviso)."* Right — a page that works beats a
   * page that makes a request, and no page can rely on an orientation lock anyway
   * (`screen.orientation.lock` needs fullscreen and iOS refuses it).
   *
   * So the whole frame turns a quarter and is sized to the swapped viewport.
   * `translate(100vw,0) rotate(90deg)` about the corner maps a frame point (lx, ly)
   * to (100vw − ly, lx), which `scene.js` inverts so the pointer lands where the
   * object thinks it is — see `pt()` and `turned()` there, and `W()`/`H()`, which
   * swap with it. Everything inside comes along, fixed-position overlays included,
   * because a transformed element is the containing block for them.
   *
   * The notice stays as a banner rather than a wall: turning the phone is still
   * better, it is just no longer required.
   */
  #frame{position:fixed;inset:0}
  @media (orientation: portrait) and (pointer: coarse){
    #frame{width:100vh;height:100vw;transform:translate(100vw,0) rotate(90deg);
      transform-origin:0 0}
    #turn{display:flex}
  }
  /* the same thing on demand, so the rotated path can be checked without a phone */
  body[data-turned] #frame{width:100vh;height:100vw;
    transform:translate(100vw,0) rotate(90deg);transform-origin:0 0}
  body[data-turned] #turn{display:flex}
  #turn{position:absolute;z-index:55;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));
    display:none;align-items:center;gap:10px;margin:0;padding:8px 14px;
    background:rgba(10,9,8,.82);border:1px solid #3A3A38;color:#8A8880;
    font-family:"Azeret Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em}
  #turn svg{stroke:#8A7A54;fill:none;stroke-width:1.5;flex:0 0 auto}

  /* Browser chrome eats a third of a phone screen and a strip of every desktop
     window — *"a parte do navegador ta deixando tudo mt pequeno."* Safari has no
     fullscreen that leaves the page in charge, so the page offers one. Hidden where
     the API is missing rather than shown and inert. */
  #full{position:absolute;z-index:55;min-height:44px;min-width:44px;
    top:calc(14px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));padding:7px 12px;
    background:rgba(10,9,8,.72);border:1px solid #3A3A38;color:#8A8880;cursor:pointer;
    font-family:"Azeret Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.18em}
  #full:hover,#full:focus-visible{color:#F0E8D2;border-color:#8A7A54}
  #full[hidden]{display:none}
  /* The workbench is not part of the object. It stays in the DOM because scene.js
     binds to every dial by id and would throw on the first missing element, but it
     is only shown when the URL asks: /?debug */
  .ctl{display:none}
  body[data-debug] .ctl{display:flex}
  /* The touch row. Shown where there is no hover and no rotary gesture to make —
     `hover:none` is the honest test for that, rather than a width breakpoint that
     would also catch a small window on a desktop. */
  .touch{position:fixed;left:0;right:0;bottom:0;display:none;gap:6px;
    padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    justify-content:center;z-index:5;font:11px/1 "Azeret Mono",ui-monospace,Menlo,monospace}
  /* 46px, inside the 44–48 a thumb actually hits. It was 12px of padding around an
     11px line, which comes to about 35 — small enough that a miss is the norm. */
  .touch button{flex:1 1 0;max-width:120px;min-height:46px;padding:12px 6px;color:#C9C2B0;
    background:#141110;border:1px solid #3A2E20;border-radius:3px;letter-spacing:.12em}
  .touch button:active{background:#241D16}
  @media (hover:none){ .touch{display:flex} }
</style>
