<!--
  Tag Manager.

  The container is loaded **only on the published host**, so a day of pressing every
  Pad four hundred times on localhost does not become the dataset. `GTM` below is the
  one place the container id lives; empty means no container is loaded at all, which
  is also how the site runs with tracking switched off.

  `dataLayer` is declared before the loader so the events `track.js` pushes during
  boot are already in the queue when the container arrives. The object is one page
  that never navigates — the pageview says almost nothing, and the events are the
  analytics.

  No `<noscript>` iframe, which the standard snippet includes. It exists to record
  visitors whose browser runs no JavaScript — and this object *is* JavaScript: without
  it there is no scene, no Screen and nothing to measure. The only thing that tag
  could ever count here is a crawler.

  The consent gate is here now, and it is a gate rather than a notice.

  A GA4 tag is published and writes a cookie, so LGPD applies to every visitor who
  merely arrives — which is a different case from the form, where the visitor asked
  for contact and art. 7, V covers it (ADR-0027). Nobody asked for this one.

  The strongest reading is also the simplest to hold: **nothing loads until someone
  says yes.** Not Consent Mode with storage denied, not a tag that fires and repents
  — the script is never fetched, so there is no cookie to argue about and no state to
  get wrong. Refusing costs the visitor nothing and costs us the measurement, which
  is the correct way round.

  `loadGTM` is left on the window so the banner can start it without a reload, on the
  visit where consent was actually given. See `prototype/consent.js`.
-->
<script>
  window.dataLayer = window.dataLayer || [];
  window.loadGTM = function () {
    var GTM = 'GTM-PLPVLQH9';
    if (window.__gtmUp || !GTM || !/(^|\.)nanj\.in$/.test(location.hostname)) return;
    window.__gtmUp = true;
    window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM;
    document.head.appendChild(s);
  };
  try {
    if (localStorage.getItem('tenebrae.consent') === 'granted') window.loadGTM();
  } catch (e) { /* storage blocked: no decision can be remembered, so none is assumed */ }
</script>

<!-- A candle, which is what the object is named after: Tenebrae is the rite where the
     lights go out one at a time, and the three Candles on the Altar are the Vigil's
     visible body (CONTEXT.md). It replaced a four-pointed star that cited the lamp row —
     a true reference to a smaller thing.

     Inline, because one more request for 300 bytes is a request too many and a missing
     favicon is a browser-drawn placeholder in every tab.

     Two things here are load-bearing at 16px, which is the only size that matters:
     the two-unit gap between flame and body is what reads as "candle" rather than as a
     blob on a stick — closing it up to tidy the shape destroys the icon — and the taper
     a real candle has was tried and dropped, because at 16px it costs a pixel of the
     silhouette and returns nothing the eye can see. Flame and body are the same brass:
     a warm flame would be a third value on the most reduced surface the site has. -->
<!-- Arquivos, e não um `data:` URI, porque o Google não consegue rastrear um data URI:
     a exigência dele é que o **Googlebot-Image rastreie o arquivo do favicon**, e um
     data URI não tem URL para rastrear. O ícone aparecia certo na aba do navegador e
     vazio na busca, que é como isso passa despercebido — e `/favicon.ico` respondia 404,
     então nem o caminho convencional existia. SVG também não serve: a lista de formatos
     aceitos do Google é BMP, GIF, ICO, PNG, JPEG, PPM e TIFF. O `.svg` fica em `public/`
     como fonte do desenho e não é declarado aqui, para o Google não escolher justamente
     o formato que ele não lê.
     O `.ico` traz 16, 32 e 48 renderizados um a um a partir do SVG — o vão de duas
     unidades entre chama e corpo é legível em cada um, em vez de virar borrão num
     downscale de 192 para 16. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
