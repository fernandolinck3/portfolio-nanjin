<title>Tenebrae Unit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Azeret+Mono:wght@400;500&family=UnifrakturMaguntia&family=Pirata+One&family=Grenze+Gotisch:wght@400;600&display=swap">
<style>
  *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden;background:#0A0A0B}
  #stage{position:fixed;inset:0} canvas{display:block}
  .hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;
    gap:14px;padding:18px 22px;flex-wrap:wrap;pointer-events:none;
    font-family:"Azeret Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:#8A8880}
  .hud b{color:#C4281C;font-weight:500}
  .ctl{pointer-events:auto;display:flex;align-items:center;gap:12px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:22px;background:transparent;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#3A3A38}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;margin-top:-9px;background:#DEDCD3;border:1px solid #000}
  input[type=range]::-moz-range-track{height:2px;background:#3A3A38}
  input[type=range]::-moz-range-thumb{width:12px;height:20px;border-radius:0;background:#DEDCD3;border:1px solid #000}
  .note{max-width:52ch;line-height:1.7}
  .sr{position:fixed;left:0;top:0;z-index:80;display:flex;gap:4px;padding:6px}
  .sr button{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .sr button:focus{position:static;width:auto;height:auto;clip:auto;margin:0;padding:5px 9px;
    font:10px/1 "Azeret Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
    background:#DEDCD3;color:#17181B;border:1px solid #000;cursor:pointer}
  #err{position:fixed;top:0;left:0;right:0;max-height:60%;overflow:auto;margin:0;padding:12px;color:#F03A22;
    background:rgba(0,0,0,.92);font:11px/1.5 monospace;white-space:pre-wrap;z-index:99;display:none}
</style>
<div id="stage"></div>
<nav class="sr" aria-label="Unit controls">
  <button data-act="0">Ident</button><button data-act="1">Now / Next</button>
  <button data-act="2">Project 001</button><button data-act="3">Rack</button>
  <button data-act="4">Method</button><button data-act="5">Out</button>
</nav>
<pre id="err"></pre>
<div class="hud">
  <p class="note">Click the pads. Drag the jog to dig, the knob to raise the vigil,<br>the fader to crossfade. The Unit leans toward the pointer.</p>
  <span class="ctl">VIGIL <input id="vigil" type="range" min="0" max="100" value="0" aria-label="Vigil"> <b id="vv">00</b></span>
  <span class="ctl">BAND <input id="band" type="range" min="40" max="200" value="118" aria-label="Engraving band"> <b id="bandv">118</b></span>
  <span class="ctl">DENSITY <input id="waves" type="range" min="0" max="26" value="0" aria-label="Engraving density"> <b id="wavesv">0</b></span>
  <span class="ctl">WEIGHT <input id="lw" type="range" min="10" max="120" value="50" aria-label="Engraving line weight"> <b id="lwv">5.0</b></span>
  <span class="ctl">GROUND <input id="hatch" type="range" min="5" max="46" value="5" aria-label="Ground spacing"> <b id="hatchv">5</b></span>
  <span class="ctl">GROWTH <input id="grow" type="range" min="0" max="16" value="0" aria-label="Vine growth"> <b id="growv">0</b></span>
  <span class="ctl">BEVEL <input id="bevel" type="range" min="1" max="30" value="10" aria-label="Bevel softness"> <b id="bevelv">10</b></span>
  <span class="ctl">DEPTH <input id="depth" type="range" min="2" max="90" value="11" aria-label="Cut depth"> <b id="depthv">11</b></span>
  <span class="ctl">TILE <input id="tile" type="range" min="10" max="300" value="100" aria-label="Pattern tile scale"> <b id="tilev">1.00</b></span>
  <span class="ctl">SCRIM <input id="scrim" type="range" min="0" max="90" value="34" aria-label="Art scrim"> <b id="scrimv">0.34</b></span>
  <span class="ctl">INK <input id="ink" type="range" min="5" max="100" value="30" aria-label="Engraving contrast"> <b id="inkv">0.30</b></span>
  <span class="ctl">SEED <input id="seed" type="range" min="1" max="60" value="25" aria-label="Seed"> <b id="seedv">25</b></span>
</div>
<script>
window.addEventListener('error',function(e){var d=document.getElementById('err');d.style.display='block';d.textContent+='ERR: '+(e.message||e)+' @'+(e.lineno||'')+String.fromCharCode(10);});
</script>
<script type="module" src="./scene.js"></script>
