<title>Screen — design workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Azeret+Mono:wght@400;500;700&family=UnifrakturMaguntia&display=swap">
<style>
  *{box-sizing:border-box} html,body{height:100%;margin:0;background:#0A0A0B;overflow:hidden;display:flex;flex-direction:column;
    font:11px/1.6 "Azeret Mono",ui-monospace,monospace;letter-spacing:.12em;color:#8A8880}
  #wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;overflow:auto}
  .row{display:flex;gap:26px;align-items:flex-end}
  canvas{display:block;image-rendering:pixelated}
  #big{box-shadow:0 0 0 1px #2A2A28, 0 24px 60px rgba(0,0,0,.8)}
  #real{box-shadow:0 0 0 1px #2A2A28}
  .cap{margin-top:8px;color:#5A5854;text-transform:uppercase}
  b{color:#C4281C;font-weight:500}
  nav{flex:none;display:flex;gap:20px;padding:12px 18px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1E1E1C;background:#0A0A0B}
  button{font:inherit;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#8A8880;
    border:1px solid #2E2E2C;padding:5px 10px;cursor:pointer}
  button[aria-pressed=true]{background:#DEDCD3;color:#17181B;border-color:#DEDCD3}
  .grp{display:flex;gap:5px;align-items:center}
  .grp>span{color:#5A5854;margin-right:6px}
  #err{position:fixed;bottom:0;left:0;right:0;padding:10px;color:#F03A22;background:rgba(0,0,0,.92);
    font:11px/1.5 monospace;white-space:pre-wrap;display:none;max-height:40%;overflow:auto}
</style>
<nav>
  <span class="grp"><span>Direction</span>
    <button data-dir="grimoire" aria-pressed="true">Grimoire</button>
    <button data-dir="instrument" aria-pressed="false">Instrument</button>
    <button data-dir="cracktro" aria-pressed="false">Cracktro</button>
  </span>
  <span class="grp"><span>Module</span>
    <button data-mod="0" aria-pressed="true">Ident</button>
    <button data-mod="1" aria-pressed="false">Now/Next</button>
    <button data-mod="2" aria-pressed="false">Proj 001</button>
    <button data-mod="3" aria-pressed="false">Rack</button>
    <button data-mod="4" aria-pressed="false">Method</button>
    <button data-mod="5" aria-pressed="false">Out</button>
  </span>
  <span class="grp"><span>Crossfade</span>
    <button data-xf="0.18" aria-pressed="true">Now</button>
    <button data-xf="0.85" aria-pressed="false">Next</button>
  </span>
</nav>
<div id="wrap">
  <div class="row">
    <div>
      <canvas id="big" width="960" height="540"></canvas>
      <div class="cap">3&times; &mdash; how it is designed</div>
    </div>
    <div>
      <canvas id="real" width="320" height="180"></canvas>
      <div class="cap"><b>1&times;</b> &mdash; how it reads on the Plate</div>
    </div>
  </div>
</div>
<pre id="err"></pre>
<script>
window.addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';
  d.textContent += 'ERR: '+(e.message||e)+' @'+(e.lineno||'')+'\n';});
</script>
<script type="module" src="./screen.js"></script>
